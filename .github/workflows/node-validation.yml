name: Node.js validation

on:
  pull_request:
  push:
    branches:
      - fix/node-24-security-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm Node.js version
        run: node --version
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
